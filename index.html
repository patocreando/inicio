<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070909" />
  <title>Pato Creando — Contenido IA + Diseño Web</title>
  <meta name="description" content="Contenido con IA y diseño web para marcas y negocios." />
  <style>
    :root{
      --bg:#060808;
      --text:#f4f7f3;
      --muted:#a1aaa4;
      --green:#b8eb6d;
      --line:rgba(255,255,255,.11);
      --glass:rgba(7,11,9,.46);
      --mx:50%;
      --my:50%;
      --px:0px;
      --py:0px;
      --rx:0deg;
      --ry:0deg;
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;
      min-height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body{overflow:hidden}
    a{color:inherit;text-decoration:none}

    .page{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      isolation:isolate;
      overflow:hidden;
      background:
        radial-gradient(900px 580px at var(--mx) var(--my),rgba(184,235,109,.08),transparent 60%),
        linear-gradient(145deg,#070909,#0a0d0c 55%,#050706);
    }

    .bg-video{
      position:absolute;
      inset:0;
      z-index:-4;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      filter:saturate(.90) contrast(1.08) brightness(.68);
      transform:scale(1.03) translate3d(calc(var(--px) * -.10),calc(var(--py) * -.10),0);
      transition:transform .9s cubic-bezier(.2,.7,.2,1);
      will-change:transform,opacity;
      opacity:0;
      transition:
        transform .9s cubic-bezier(.2,.7,.2,1),
        opacity 1.05s linear;
    }
    .bg-video.is-active{
      opacity:1;
    }

    .veil{
      position:absolute;
      inset:0;
      z-index:-3;
      background:
        radial-gradient(circle at 50% 48%,rgba(4,7,6,.52) 0 13%,rgba(4,7,6,.28) 26%,rgba(4,7,6,.08) 45%,transparent 64%),
        linear-gradient(180deg,rgba(4,7,6,.14),rgba(4,7,6,.34));
      pointer-events:none;
    }

    .glow{
      position:absolute;
      z-index:-2;
      left:50%;
      top:48%;
      width:min(700px,72vw);
      aspect-ratio:1;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle,rgba(184,235,109,.08),transparent 62%);
      filter:blur(30px);
      pointer-events:none;
      transition:transform .22s ease-out;
    }

    .shell{
      width:min(980px,calc(100% - 40px));
      display:grid;
      gap:18px;
      padding:24px 0;
      transform:translate3d(calc(var(--px) * .08),calc(var(--py) * .08),0);
      transition:transform .8s cubic-bezier(.2,.7,.2,1);
      will-change:transform;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .brand{
      font-size:10px;
      font-weight:760;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:rgba(244,247,243,.82);
      opacity:0;
      transform:translateY(-8px);
      animation:brandIn .8s .08s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .hero{
      display:grid;
      justify-items:center;
      text-align:center;
      gap:20px;
      transform-style:preserve-3d;
    }

    .descriptor{
      margin:0;
      color:rgba(238,243,239,.64);
      font-size:11px;
      line-height:1.35;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:0;
      transform:translateY(8px);
      animation:descriptorIn .8s .12s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .descriptor .key{
      color:var(--green);
      font-weight:700;
    }

    h1{
      margin:0;
      max-width:820px;
      font-size:clamp(46px,7.4vw,96px);
      line-height:.92;
      letter-spacing:-.065em;
      font-weight:650;
      opacity:0;
      transform:translate3d(calc(var(--px) * .16),calc(var(--py) * .16 + 16px),0);
      animation:titleIn .95s .16s cubic-bezier(.16,.8,.22,1) forwards, titleFloat 6.8s 1.3s ease-in-out infinite;
      will-change:transform;
    }
    .accent{
      color:var(--green);
      display:inline-block;
      text-shadow:0 0 30px rgba(184,235,109,.18);
      animation:accentBreathe 4.6s 1.5s ease-in-out infinite;
    }

    .choices{
      width:min(760px,100%);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      perspective:1000px;
    }

    .choice{
      min-height:92px;
      padding:15px 18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),
        var(--glass);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      text-align:left;
      box-shadow:0 18px 55px rgba(0,0,0,.24);
      transition:
        transform .34s cubic-bezier(.2,.7,.2,1),
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
      opacity:0;
      will-change:transform;
    }

    .choice:nth-child(1){
      animation:cardIn .85s .34s cubic-bezier(.16,.8,.22,1) forwards, cardFloatA 7s 1.3s ease-in-out infinite;
    }
    .choice:nth-child(2){
      animation:cardIn .85s .43s cubic-bezier(.16,.8,.22,1) forwards, cardFloatB 7.6s 1.45s ease-in-out infinite;
    }

    .choice:hover{
      transform:translateY(-6px) scale(1.018) rotateX(var(--ry)) rotateY(var(--rx));
      border-color:rgba(184,235,109,.34);
      background:
        linear-gradient(180deg,rgba(184,235,109,.055),rgba(255,255,255,.014)),
        rgba(7,11,9,.52);
      box-shadow:0 24px 75px rgba(0,0,0,.34);
    }

    .choice-copy{display:grid;gap:5px}
    .choice h2{
      margin:0;
      font-size:clamp(23px,2.15vw,30px);
      line-height:1;
      letter-spacing:-.045em;
      font-weight:620;
    }
    .choice p{
      margin:0;
      color:var(--muted);
      font-size:11px;
      letter-spacing:.015em;
    }
    .choice-result{
      display:block;
      margin-top:3px;
      color:rgba(244,247,243,.54);
      font-size:9px;
      letter-spacing:.045em;
    }
    .key{
      color:var(--green);
      font-weight:700;
      text-shadow:0 0 18px rgba(184,235,109,.15);
      animation:keyPulse 5.2s ease-in-out infinite;
    }
    .choice:nth-child(2) .key{animation-delay:.65s}

    .arrow{
      flex:0 0 auto;
      font-size:18px;
      color:rgba(255,255,255,.52);
      transition:transform .25s ease,color .25s ease;
    }
    .choice:hover .arrow{
      transform:translate(3px,-3px);
      color:var(--green);
    }


    .help-cta{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-top:2px;
      color:rgba(244,247,243,.58);
      font-size:10px;
      letter-spacing:.045em;
      text-decoration:none;
      transition:color .22s ease,transform .22s ease;
      opacity:0;
      animation:descriptorIn .8s .58s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .help-cta:hover{
      color:var(--green);
      transform:translateY(-1px);
    }
    .help-cta span:last-child{
      color:var(--green);
      font-size:13px;
    }

    @keyframes descriptorIn{
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes brandIn{
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes titleIn{
      to{opacity:1;transform:translate3d(calc(var(--px) * .16),calc(var(--py) * .16),0)}
    }
    @keyframes cardIn{
      from{opacity:0;transform:translateY(18px) scale(.975)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes titleFloat{
      0%,100%{translate:0 0}
      50%{translate:0 -5px}
    }
    @keyframes cardFloatA{
      0%,100%{translate:0 0}
      50%{translate:0 -4px}
    }
    @keyframes cardFloatB{
      0%,100%{translate:0 -1px}
      50%{translate:0 4px}
    }
    @keyframes accentBreathe{
      0%,100%{filter:brightness(1);transform:scale(1)}
      50%{filter:brightness(1.08);transform:scale(1.012)}
    }
    @keyframes keyPulse{
      0%,100%{text-shadow:0 0 14px rgba(184,235,109,.10)}
      50%{text-shadow:0 0 24px rgba(184,235,109,.28)}
    }

    .transition-flash{
      position:fixed;
      z-index:2147483646;
      width:22px;
      height:22px;
      border-radius:50%;
      left:var(--fx,50%);
      top:var(--fy,50%);
      transform:translate(-50%,-50%) scale(.2);
      opacity:0;
      pointer-events:none;
      background:
        radial-gradient(circle,
          rgba(255,255,255,.98) 0 8%,
          rgba(207,230,90,.94) 14%,
          rgba(184,235,109,.54) 34%,
          rgba(184,235,109,.15) 54%,
          transparent 72%);
      filter:blur(.2px);
      mix-blend-mode:screen;
    }
    .transition-veil{
      position:fixed;
      inset:0;
      z-index:2147483645;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(circle at var(--fx,50%) var(--fy,50%),
          rgba(205,240,126,.16),
          rgba(4,7,6,.18) 28%,
          rgba(4,7,6,.78) 68%,
          #050706 100%);
    }
    .transition-rings{
      position:fixed;
      z-index:2147483644;
      left:var(--fx,50%);
      top:var(--fy,50%);
      width:80px;
      height:80px;
      transform:translate(-50%,-50%) scale(.5);
      border-radius:50%;
      border:1px solid rgba(207,230,90,.55);
      opacity:0;
      pointer-events:none;
      box-shadow:
        0 0 0 20px rgba(207,230,90,.04),
        0 0 60px rgba(207,230,90,.14);
    }
    .page.is-transitioning .transition-flash{
      animation:flashBurst .62s cubic-bezier(.14,.8,.22,1) forwards;
    }
    .page.is-transitioning .transition-veil{
      animation:veilIn .62s ease forwards;
    }
    .page.is-transitioning .transition-rings{
      animation:ringExpand .62s cubic-bezier(.14,.8,.22,1) forwards;
    }
    .page.is-transitioning .shell{
      animation:shellExit .62s cubic-bezier(.16,.8,.22,1) forwards;
    }
    .page.is-transitioning .bg-video{
      filter:saturate(1) contrast(1.14) brightness(.84);
      transform:scale(1.085);
    }
    .choice.is-triggered{
      border-color:rgba(207,230,90,.58)!important;
      box-shadow:
        0 0 0 1px rgba(207,230,90,.20),
        0 0 48px rgba(207,230,90,.20),
        0 28px 80px rgba(0,0,0,.42)!important;
    }

    @keyframes flashBurst{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
      18%{opacity:1}
      62%{opacity:.88;transform:translate(-50%,-50%) scale(34)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(52)}
    }
    @keyframes ringExpand{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}
      22%{opacity:.95}
      100%{opacity:0;transform:translate(-50%,-50%) scale(8)}
    }
    @keyframes veilIn{
      0%{opacity:0}
      45%{opacity:.28}
      100%{opacity:1}
    }
    @keyframes shellExit{
      0%{opacity:1;filter:blur(0);transform:scale(1)}
      55%{opacity:.92;filter:blur(.3px);transform:scale(1.01)}
      100%{opacity:0;filter:blur(3px);transform:scale(1.035)}
    }

    @media (max-width:720px){
      body{overflow:auto}
      .page{min-height:100svh}
      .shell{
        width:min(100% - 24px,640px);
        gap:22px;
        padding:18px 0;
      }
      .top{padding:0 3px}
      h1{
        max-width:520px;
        font-size:clamp(46px,14vw,70px);
      }
      .choices{
        grid-template-columns:1fr;
        gap:10px;
      }
      .choice{
        min-height:88px;
        padding:14px 16px;
        border-radius:15px;
      }
      .choice h2{font-size:26px}
      .choice p{font-size:11px}
      .descriptor{
        max-width:320px;
        font-size:9px;
        letter-spacing:.1em;
      }
      .choice-result{font-size:8.5px}
      .help-cta{font-size:9px}
      .bg-video{
        object-position:center;
        transform:scale(1.06);
      }
      .shell{transform:none}
      h1{transform:none}
      .choice:nth-child(1),
      .choice:nth-child(2){animation-name:cardIn}
    }

    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{transition:none!important;animation:none!important}
      .brand,.choice,h1{opacity:1!important;transform:none!important}
      .bg-video,.shell{transform:none!important}
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <video class="bg-video bg-video-a is-active" id="bgVideoA" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="./assets/hero-bg.mp4?v=tunnel-20261004-3" type="video/mp4" />
    </video>
    <video class="bg-video bg-video-b" id="bgVideoB" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="./assets/hero-bg.mp4?v=tunnel-20261004-3" type="video/mp4" />
    </video>
    <div class="veil" aria-hidden="true"></div>
    <div class="glow" id="glow" aria-hidden="true"></div>
    <div class="transition-rings" aria-hidden="true"></div>
    <div class="transition-flash" aria-hidden="true"></div>
    <div class="transition-veil" aria-hidden="true"></div>

    <div class="shell">
      <div class="top">
        <div class="brand">Pato Creando</div>
      </div>

      <section class="hero" aria-labelledby="hero-title">
        <p class="descriptor">Contenido, <span class="key">diseño</span> y experiencias digitales para marcas.</p>
        <h1 id="hero-title">¿Qué querés <span class="accent">crear?</span></h1>

        <div class="choices">
          <a class="choice" href="https://patocreando.github.io/portfolio/" aria-label="Ver portfolio de contenido con IA">
            <div class="choice-copy">
              <h2>Contenido con <span class="key">IA</span></h2>
              <p><span class="key">UGC</span> · <span class="key">Ads</span> · Product Videos</p>
              <small class="choice-result">Para mostrar y vender mejor.</small>
            </div>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>

          <a class="choice" href="https://patocreando.github.io/web/" aria-label="Ver servicio de diseño web">
            <div class="choice-copy">
              <h2>Diseño <span class="key">Web</span></h2>
              <p><span class="key">Landing</span> · Desarrollo · <span class="key">Conversión</span></p>
              <small class="choice-result">Para ordenar y convertir visitas.</small>
            </div>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </div>

        <a class="help-cta" href="https://ig.me/m/patocreando?ref=w61000387" aria-label="Consultar qué servicio conviene">
          <span>¿No sabés cuál necesitás? Te digo qué haría.</span><span aria-hidden="true">↗</span>
        </a>
      </section>
    </div>
  </main>

  <script>
    const page=document.getElementById('page');
    const glow=document.getElementById('glow');
    const bgVideoA=document.getElementById('bgVideoA');
    const bgVideoB=document.getElementById('bgVideoB');
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

    if(bgVideoA && bgVideoB){
      const videos=[bgVideoA,bgVideoB];
      let activeIndex=0;
      let switching=false;
      const crossfadeLead=1.08;
      const fadeMs=1080;

      // Keep both videos playing from the start. The hidden layer stays decoded,
      // so switching never reveals an unloaded/frozen first frame.
      videos.forEach(v=>{
        v.muted=true;
        v.loop=true;
        v.play().catch(()=>{});
      });

      bgVideoB.currentTime=0.18;

      const armNext=()=>{
        const current=videos[activeIndex];
        const next=videos[1-activeIndex];
        if(!current.duration || switching) return;

        const remaining=current.duration-current.currentTime;
        if(remaining<=crossfadeLead){
          switching=true;

          // Seek the already-playing hidden layer to the start of the tunnel.
          try{ next.currentTime=.04; }catch(e){}
          next.play().catch(()=>{});

          requestAnimationFrame(()=>{
            requestAnimationFrame(()=>{
              next.classList.add('is-active');
              current.classList.remove('is-active');
            });
          });

          setTimeout(()=>{
            // Reset the old layer while it is fully hidden, but keep it playing/warm.
            try{ current.currentTime=.04; }catch(e){}
            current.play().catch(()=>{});
            activeIndex=1-activeIndex;
            switching=false;
          },fadeMs+80);
        }
      };

      videos.forEach(v=>v.addEventListener('timeupdate',armNext,{passive:true}));
    }

    document.querySelectorAll('.choice').forEach(card=>{
      card.addEventListener('click',e=>{
        if(
          e.defaultPrevented ||
          e.button!==0 ||
          e.metaKey || e.ctrlKey || e.shiftKey || e.altKey
        ) return;

        e.preventDefault();
        const href=card.href;
        if(reduce){
          window.location.href=href;
          return;
        }
        const rect=card.getBoundingClientRect();
        const fx=e.clientX || rect.left+rect.width/2;
        const fy=e.clientY || rect.top+rect.height/2;

        page.style.setProperty('--fx',fx+'px');
        page.style.setProperty('--fy',fy+'px');
        card.classList.add('is-triggered');
        page.classList.add('is-transitioning');

        setTimeout(()=>{ window.location.href=href; },560);
      });
    });

    if(!reduce){
      let tx=0,ty=0,cx=0,cy=0;
      const cards=[...document.querySelectorAll('.choice')];

      addEventListener('pointermove',e=>{
        const nx=e.clientX/innerWidth-.5;
        const ny=e.clientY/innerHeight-.5;
        tx=nx*22;
        ty=ny*18;

        page.style.setProperty('--mx',((nx+.5)*100)+'%');
        page.style.setProperty('--my',((ny+.5)*100)+'%');
        page.style.setProperty('--rx',(nx*3.2)+'deg');
        page.style.setProperty('--ry',(-ny*2.6)+'deg');

        glow.style.transform='translate(calc(-50% + '+(nx*22)+'px),calc(-50% + '+(ny*18)+'px))';
      },{passive:true});

      const tick=()=>{
        cx+=(tx-cx)*.055;
        cy+=(ty-cy)*.055;
        page.style.setProperty('--px',cx.toFixed(2)+'px');
        page.style.setProperty('--py',cy.toFixed(2)+'px');
        requestAnimationFrame(tick);
      };
      tick();

      cards.forEach(card=>{
        card.addEventListener('pointermove',e=>{
          const r=card.getBoundingClientRect();
          const x=(e.clientX-r.left)/r.width-.5;
          const y=(e.clientY-r.top)/r.height-.5;
          card.style.setProperty('--cardX',(x*7)+'deg');
          card.style.setProperty('--cardY',(-y*6)+'deg');
          card.style.transform='translateY(-6px) scale(1.018) rotateX('+(-y*5)+'deg) rotateY('+(x*6)+'deg)';
        });
        card.addEventListener('pointerleave',()=>{card.style.transform=''});
      });
    }
  </script>
</body>
</html>
